/* A small x3.conf for tools/test_bind_keycloak_ids.py.
 * Only the parts bind-keycloak-ids.py reads are here.
 */
"services" {
    "nickserv" {
        "nick" "AuthServ";
        // The rule X3 applies to new account names.
        "valid_account_regex" "^[-_a-z0-9A-Z]{2,15}$";
        "keycloak_url" "http://keycloak.invalid:8080";
        "keycloak_realm" "fixture-realm";
        "keycloak_client_id" "fixture-client";
        "keycloak_client_secret" "fixture-secret-do-not-print";
    };
};

"dbs" {
    "NickServ" { "mondo_section" "NickServ"; };
    "ChanServ" { "mondo_section" "ChanServ"; };
};
